<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>دلوقتي ماركت</title>

<link
  rel="manifest"
  href="manifest.webmanifest"
>

<meta
  name="theme-color"
  content="#0b1a4a"
>

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="style.css"
>

<link
  rel="icon"
  href="logo.png"
>

</head>


<body>


<!-- =========================
     الهيدر
========================= -->

<header>

  <h1>

    <img
      src="logo.png"
      alt="دلوقتي ماركت"
    >

    دلوقتي ماركت

  </h1>


  <a
    id="wa"
    class="hidden"
    style="color:#fff"
    target="_blank"
    rel="noopener"
  >
    واتساب
  </a>

</header>



<main>


  <!-- =========================
       البحث
  ========================= -->

  <input
    id="q"
    placeholder="ابحث عن منتج"
    aria-label="بحث عن منتج"
    autocomplete="off"
  >



  <!-- =========================
       الأقسام
  ========================= -->

  <div
    id="categories"
    class="tabs"
    style="margin-top:1rem;overflow-x:auto"
    aria-label="أقسام المنتجات"
  >

    <button
      type="button"
      class="on"
      data-category="all"
    >
      🛍️ الكل
    </button>

  </div>



  <!-- =========================
       لا توجد منتجات
  ========================= -->

  <p
    id="empty"
    class="hidden"
  >
    لا توجد منتجات مطابقة.
  </p>



  <!-- =========================
       المنتجات
  ========================= -->

  <div
    id="list"
    class="grid"
    style="margin-top:1rem;margin-bottom:6rem"
  ></div>


</main>



<!-- =========================
     السلة
========================= -->

<section
  id="cart"
  class="cart hidden"
  aria-live="polite"
>


  <div class="row">

    <strong id="sum"></strong>

    <span>

      <button
        class="ghost"
        id="toggle"
        type="button"
      >
        عرض السلة
      </button>

    </span>

  </div>



  <!-- تفاصيل السلة -->

  <div
    id="detail"
    class="hidden"
  >


    <!-- المنتجات الموجودة بالسلة -->

    <div id="lines"></div>



    <!-- =========================
         بيانات العميل
    ========================= -->

    <label for="name">
      الاسم
    </label>

    <input
      id="name"
      maxlength="80"
      autocomplete="name"
      placeholder="اكتب اسمك"
    >



    <label for="phone">
      رقم الموبايل
    </label>

    <input
      id="phone"
      type="tel"
      maxlength="20"
      autocomplete="tel"
      placeholder="01xxxxxxxxx"
    >



    <label for="addr">
      العنوان بالتفصيل
    </label>

    <textarea
      id="addr"
      rows="2"
      maxlength="300"
      placeholder="اكتب عنوان التوصيل بالتفصيل"
    ></textarea>



    <!-- =========================
         تحديد الموقع
    ========================= -->

    <div
      id="locationBox"
      class="card"
      style="margin-top:1rem"
    >

      <strong>
        📍 موقع التوصيل
      </strong>


      <p
        id="locationStatus"
        class="msg"
        style="margin:.5rem 0"
      >
        لم يتم تحديد موقعك بعد.
      </p>


      <button
        type="button"
        class="ghost"
        id="getLocation"
        style="width:100%"
      >
        📍 تحديد موقعي على الخريطة
      </button>


      <a
        id="customerMap"
        href="#"
        target="_blank"
        rel="noopener"
        class="hidden"
        style="display:block;margin-top:.5rem"
      >
        📍 فتح موقعي على Google Maps
      </a>

    </div>



    <!-- رسالة الحالة -->

    <p
      id="status"
      class="msg hidden"
    ></p>



    <!-- تأكيد الطلب -->

    <button
      class="sun"
      id="send"
      type="button"
      style="width:100%;margin-top:.8rem"
    >
      تأكيد الطلب
    </button>


  </div>

</section>



<!-- =========================
     JavaScript
========================= -->

<script
  type="module"
  src="app.js"
></script>


<script>

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("sw.js")
    .catch(error => {
      console.error(
        "Service Worker registration failed:",
        error
      );
    });

}

</script>


</body>

</html>
